name: SenseBridge
options:
  bundleIdPrefix: com.sensebridge
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en

packages:
  SenseBridgeCore:
    path: Packages/SenseBridgeCore
  # Crash reporting, off unless the user opts in at runtime *and* a DSN was
  # configured at build time — see SenseBridge/App/CrashReporting.swift and
  # Config/Sentry.xcconfig. MIT-licensed (verified 2026-07-31), which clears the
  # model-license gate in CLAUDE.md; AGPL and apple-amlr are the hard blockers.
  #
  # Linked only into the app target, never into SenseBridgeCore: the core
  # package holds the perception and reasoning domain and must stay
  # framework-independent per the protocol-seams invariant, so the SDK lives in
  # the App layer where the other side-effecting adapters already are.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.24.0"

targets:
  SenseBridge:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SenseBridge
    dependencies:
      - package: SenseBridgeCore
      - package: Sentry
        product: Sentry
    # The team ID lives in the gitignored Config/Signing.local.xcconfig that
    # this includes, so regenerating the project never writes one personal
    # Apple Developer account into a tracked file. See docs/ENVIRONMENT.md.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # Overridable prefix, mirroring project.pbxproj — `com.sensebridge` is
        # registered to this project's Apple Developer team, so a contributor
        # signing with their own free Apple ID sets BUNDLE_ID_PREFIX in the
        # gitignored Config/Signing.local.xcconfig. See Config/Signing.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX:default=com.sensebridge).app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "SenseBridge uses the camera to read text and describe scenes for you. Nothing leaves your device."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SenseBridge uses the microphone to recognize nearby sounds and announce them. Nothing leaves your device."
        # Solely so hands-free awareness can say out loud that it stopped when
        # the app leaves the screen — see AmbientAwarenessSession. iOS revokes
        # camera access on backgrounding regardless, so this buys no background
        # observation.
        INFOPLIST_KEY_UIBackgroundModes: audio
        # Crash-reporting endpoint, empty unless Config/Sentry.local.xcconfig
        # supplies one. Carried through Info.plist rather than a Swift constant
        # so the value never lands in a tracked source file — CrashReporting
        # reads it from Bundle.main. A DSN is not a credential (it is
        # write-only ingest), but it names one deployment's Sentry project, so
        # a fork must not inherit this one. See Config/Sentry.xcconfig.
        INFOPLIST_KEY_SentryDSN: $(SENTRY_DSN)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Clears "Metadata extraction skipped. No AppIntents.framework
        # dependency found." on every build. Nothing here adopts App Intents, so
        # the extraction step has nothing to do and says so; linking the
        # framework just to quiet it would add a dependency for no feature.
        # This passes `--force`, which is what the SenseBridgeCore package
        # target already gets — the processor then reports "extracted no
        # relevant App Intents symbols" and writes nothing, so no empty metadata
        # bundle lands in the app. `LM_FILTER_WARNINGS` does *not* work here:
        # its `--quiet-warnings` is passed but this notice still prints.
        # Setting names are from Xcode's own AppIntentsMetadata.xcspec.
        LM_FORCE_LINK_GENERATION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  SenseBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SenseBridgeTests
    dependencies:
      - target: SenseBridge
      - package: SenseBridgeCore
      # So CrashReportingTests can build a real `Event` and assert what
      # `CrashReporting.scrub` strips off it. The scrubber is the last thing
      # standing between a crash report and a user's personal data, which makes
      # it the one part of the SDK integration that has to be tested against
      # the SDK's own types rather than a stand-in.
      - package: Sentry
        product: Sentry
    settings:
      base:
        SWIFT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        # Same prefix override as the app target above — see Config/Signing.xcconfig.
        # Without this, XcodeGen derives the ID from `bundleIdPrefix` and hardcodes
        # `com.sensebridge`, so a contributor who sets BUNDLE_ID_PREFIX gets a
        # signable app and unsignable test bundles.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX:default=com.sensebridge).SenseBridgeTests

  SenseBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SenseBridgeUITests
    dependencies:
      - target: SenseBridge
    settings:
      base:
        SWIFT_VERSION: "6"
        TEST_TARGET_NAME: SenseBridge
        GENERATE_INFOPLIST_FILE: YES
        # See the note on SenseBridgeTests above.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX:default=com.sensebridge).SenseBridgeUITests

schemes:
  SenseBridge:
    build:
      targets:
        SenseBridge: all
        SenseBridgeTests: [test]
        SenseBridgeUITests: [test]
    test:
      targets:
        - SenseBridgeTests
        - SenseBridgeUITests
    run:
      config: Debug
