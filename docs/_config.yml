title: SenseBridge Documentation
description: Open-source, on-device, private accessibility for blind and low-vision iPhone users.
show_downloads: false

# Set explicitly so `relative_url`/`absolute_url` resolve identically in a
# local build and on GitHub Pages. This is a project site served under
# /sensebridge, not at the domain root, so an unset `baseurl` would 404 every
# /assets/... path locally even though production injects the prefix.
url: https://kevinle3212.github.io
baseurl: /sensebridge

# `{% seo %}` in _layouts/default.html emits canonical/Open Graph/JSON-LD tags.
# It ships with the `github-pages` gem but is only loaded when declared here.
plugins:
  - jekyll-seo-tag

# Every markdown page uses the custom "Signal Path" layout; individual pages
# don't need their own `layout:` front matter key.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
