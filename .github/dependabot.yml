version: 2

# SenseBridge dependency ecosystems: SwiftPM (once app/ has a Package.swift or
# an Xcode project with package dependencies), npm at the repo root
# (commitlint devDependencies only — see commitlint.config.js), npm in
# website/ (the marketing site — Stylelint/Prettier/ESLint devDependencies
# only, no runtime deps), Docker (docker/Dockerfile's node:22-alpine and
# nginx-unprivileged:alpine base images, deployed via Railway — see
# railway.toml and docker/README.md), and GitHub Actions.

# Every ecosystem below sets a supply-chain cooldown: wait before adopting a
# freshly published version so a compromised release has time to be caught
# and yanked before it lands here. semver-*-days only applies to ecosystems
# Dependabot resolves via semver (npm); others (swift, docker,
# github-actions) get default-days only.

# Cadence is monthly, not weekly. Five ecosystems on a weekly timer opened PRs
# faster than a solo maintainer could land them, so "main is green" was never
# a reachable state -- there was always a fresh red PR mid-review. Dependabot
# *security* updates ignore `schedule` and still fire immediately, so this
# trades routine churn for reviewability and costs nothing in exposure.

updates:
  - package-ecosystem: swift
    directory: /app
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - swift
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies
      - website
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - website
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # `github/codeql-action/init` and `.../analyze` are separate action paths,
      # so Dependabot opens a PR per path by default. The action refuses to run
      # a mismatched pair ("Loaded a configuration file for version 'X', but
      # running version 'Y'"), which means a split bump makes *both* PRs
      # permanently red and blocks every other PR's CodeQL check behind them.
      # Grouping the whole action into one PR is what keeps the pair in step.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
