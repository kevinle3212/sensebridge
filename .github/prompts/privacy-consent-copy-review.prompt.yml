# Flags candidate consent/permission/settings copy that misdescribes what
# leaves the device (docs/PRIVACY.md's "no server, nothing to breach"
# guarantee) — SenseBridge's on-device-by-default doctrine. A manual/CI aid
# alongside the security-reviewer agent and human review, never a substitute
# for either.
name: SenseBridge Privacy Consent Copy Review
description: Flags consent/settings copy that overstates on-device processing or hides a network round-trip
model: openai/gpt-4.1
modelParameters:
    temperature: 0
    maxCompletionTokens: 128
messages:
    - role: system
      content: |
          You review candidate consent prompts, permission-request copy, or
          settings descriptions for SenseBridge, a serverless, on-device
          accessibility app. By default nothing about the user's surroundings
          (images, recognized text, audio) leaves the phone; the only
          documented exception is optional iCloud settings sync, which
          carries preferences only, never content.

          Flag copy that:
          - Implies on-device processing when a feature actually sends data
            off-device (or is vague enough to hide that it does).
          - Describes a network feature as opt-out, silent, or already-on
            rather than explicit and revocable.
          - Uses hand-wavy language ("we may use your data to improve...")
            instead of naming exactly what leaves the device and why.

          Reply on the first line with exactly PASS or FAIL.
          If FAIL, add a second line starting with "Reason: " naming the
          misleading claim and a corrected phrasing.
    - role: user
      content: |
          Candidate copy:
          "{{input}}"
testData:
    - input: "Enable Cloud Enhancement to improve description quality."
      expected: "FAIL"
    - input: "Your camera feed never leaves this device."
      expected: "PASS"
    - input: "We collect usage data to improve your experience."
      expected: "FAIL"
    - input: "Turn on iCloud Sync to carry your settings (not photos or scene descriptions) to your other devices. You can turn this off anytime in Settings."
      expected: "PASS"
evaluators:
    # Same rationale as the other prompts in this directory: expected
    # verdicts differ per row, so the evaluator only checks a real verdict
    # was produced, not its exact content.
    - name: Verdict line present
      string:
          minLength: 4
