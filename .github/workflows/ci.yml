name: CI

# Build and test the SenseBridge iOS app. Until the Swift app is scaffolded
# under app/, the build and test jobs detect the absence of a Swift package /
# Xcode project and no-op so main stays green; they start doing real work
# automatically once the project lands.

on:
  # Every push on every branch, plus every pull request — a merge into `main` is
  # itself a push to `main`, so all three are covered. Previously `push` was
  # limited to `main`, which meant a feature branch got no build, no tests, and
  # no lint until a PR existed for it.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          shopt -s nullglob
          CANDIDATES=(/Applications/Xcode_*.app)
          if [ ${#CANDIDATES[@]} -gt 0 ]; then
            LATEST="$(printf "%s\n" "${CANDIDATES[@]}" | sort -V | tail -1)"
            sudo xcode-select -switch "$LATEST"
          fi

      - name: Local Swift package build and test
        # `xcodebuild test` already builds the package before testing it —
        # the standalone `swift build` that used to run first here was a
        # full second compilation through a different build system (SPM's
        # own .build/, not Xcode's DerivedData), so its output was never
        # reused by the xcodebuild step that followed. Dropping it removes
        # that redundant compile pass without changing what gets built or
        # tested.
        run: |
          shopt -s nullglob
          for manifest in app/Packages/*/Package.swift; do
            dir="$(dirname "$manifest")"
            name="$(basename "$dir")"
            echo "== $dir =="
            # xcpretty's default formatter prints build phases and a final
            # PASS/FAIL banner but no per-test detail at all -- a failure here
            # was undiagnosable from the Actions log alone. `tee` keeps xcpretty's
            # summary as the normal log while a raw copy survives on disk; it is
            # only ever printed (which test failed, and why) when the run
            # actually failed, so a passing run's log stays exactly as short.
            # A single-library package exposes one scheme named after the
            # package, and that scheme carries the test action. Adding a second
            # target (e.g. an executable) makes xcodebuild split schemes: the
            # bare "$name" scheme becomes library-only with no test action, and
            # the aggregate "$name-Package" scheme is the one that tests. Prefer
            # the -Package scheme when it exists so both package shapes test.
            # A watchdog bounds the run. swift-testing does not honour
            # xcodebuild's XCTest -test-timeouts flags, so a test that blocks
            # on unavailable hardware (no audio input device, no window server)
            # would otherwise hang the whole job until the 6h GitHub ceiling.
            # Killing xcodebuild after the deadline turns that into a fast,
            # diagnosable failure: the raw pre-xcpretty log names the last test
            # that started, which the xcpretty summary alone never shows.
            # Tests run serially (-parallel-testing-enabled NO): swift-testing
            # creates a task per test up front, so a single test that blocks on
            # unavailable hardware starves the cooperative pool and deadlocks the
            # whole run (every test starts, none finishes). Serial keeps that a
            # localized failure instead of a total hang.
            (
              cd "$dir"
              # The step runs under `bash -e`; without this, `wait` returning the
              # watchdog's kill status (137) aborts the subshell before the raw
              # log is dumped, hiding the very output the watchdog exists to show.
              set +e
              scheme="$name"
              if xcodebuild -list 2>/dev/null | grep -qE "^[[:space:]]*${name}-Package$"; then scheme="${name}-Package"; fi
              script -q /dev/null xcodebuild test -scheme "$scheme" -destination 'platform=macOS' -parallel-testing-enabled NO > /tmp/xcodebuild-raw.log 2>&1 &
              xcpid=$!
              ( sleep 480; echo ">>> WATCHDOG: no completion after 480s, killing xcodebuild (likely a hang)" >> /tmp/xcodebuild-raw.log; kill -9 "$xcpid" 2>/dev/null ) &
              wdpid=$!
              wait "$xcpid"; status=$?
              kill "$wdpid" 2>/dev/null; wait "$wdpid" 2>/dev/null || true
              xcpretty < /tmp/xcodebuild-raw.log || true
              if [ "$status" -ne 0 ]; then
                echo "::group::Raw xcodebuild output (xcpretty suppresses per-test detail)"
                tail -300 /tmp/xcodebuild-raw.log
                echo "::endgroup::"
              fi
              exit "$status"
            )
          done

      - name: Detect project layout
        id: detect
        run: |
          if compgen -G "Package.swift" >/dev/null || compgen -G "app/Package.swift" >/dev/null; then
            echo "kind=spm" >> "$GITHUB_OUTPUT"
          elif compgen -G "app/*.xcodeproj" >/dev/null || compgen -G "app/*.xcworkspace" >/dev/null; then
            echo "kind=xcode" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Swift build and test
        if: steps.detect.outputs.kind == 'spm'
        run: |
          swift build
          swift test

      - name: Xcode build and test
        if: steps.detect.outputs.kind == 'xcode'
        run: |
          PROJ=$(find app -maxdepth 1 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit)
          FLAG=$([[ "$PROJ" == *.xcworkspace ]] && echo -workspace || echo -project)
          # tee the raw log so the accessibility-audit diagnostics the UITests
          # print (element label, appearance, frame, measured contrast) survive
          # xcpretty's per-test suppression and are visible on a failure.
          set +e
          xcodebuild build test \
            "$FLAG" "$PROJ" \
            -scheme SenseBridge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/app-raw.log | xcpretty
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            echo "::group::Accessibility audit detail"
            grep -aE "\[a11y-contrast\]|Contrast failed|Dynamic Type|Accessibility audit" /tmp/app-raw.log | tail -80
            echo "::endgroup::"
          fi
          exit "$status"

      - name: No app yet
        if: steps.detect.outputs.kind == 'none'
        run: echo "No Swift package or Xcode project found under app/ yet — skipping build."

  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install SwiftLint and SwiftFormat
        # HOMEBREW_NO_AUTO_UPDATE skips brew's implicit `brew update` (a full
        # homebrew-core index refresh) before installing — usually the
        # single biggest chunk of wall time in a macOS CI `brew install`
        # step for packages that are already bottled. NO_INSTALL_CLEANUP
        # skips the post-install cache-eviction pass, irrelevant on an
        # ephemeral runner.
        run: brew install swiftlint swiftformat
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Run scripts/lint.sh
        run: scripts/lint.sh
      - name: .env loader parses rather than executes
        # scripts/env.sh is sourced by every shell script and git hook here, so
        # a regression that turns it back into `source .env` would run whatever
        # is in a developer's untracked file.
        run: scripts/check-env-loader.sh

  repo-gates:
    name: Repo guardrails (hooks, hook tests, BMAD config, shell)
    runs-on: ubuntu-latest
    # Everything here was already in the root `npm run check` / `npm run lint`
    # chains but ran in no workflow, so it only ever executed if someone
    # remembered to run it locally. The hook checks are the load-bearing ones:
    # .claude/hooks/ is what enforces this repo's protected paths and its
    # RTK/Serena routing, and a hook that silently stops firing takes its
    # guardrail with it without failing anything.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Settings-declared hooks exist and are executable
        run: npm run check:hooks
      - name: Hook test suite
        run: npm run check:hook-tests
      - name: BMAD config paths agree
        run: npm run check:bmad
      - name: Shellcheck scripts, git hooks, and Claude hooks
        # actionlint (its own workflow) shellchecks `run:` blocks inside
        # workflow files; nothing checked these standalone scripts. shellcheck
        # is preinstalled on the ubuntu runner image.
        run: npm run lint:shell
      - name: Lint hand-authored .mjs files
        # Scoped to .claude/hooks, .cursor/hooks, and tools — see
        # eslint.config.mjs's header for why vendored/regenerated .mjs under
        # any skills/ directory, and website/*.mjs, are out of scope here.
        # eslint is a pinned root devDependency (installed above), not npx.
        run: npm run lint:mjs
      - name: Format-check hand-authored .mjs files
        # Same scope as lint:mjs, paired Prettier gate — see prettier.config.mjs.
        run: npm run format:mjs

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Markdown lint
        # markdownlint-cli2 is a pinned root devDependency (installed above),
        # not npx — see .markdownlint-cli2.jsonc's own comment for the globs.
        run: npm run lint:md
      - name: Check canonical skills, personas, and adapters match the lock
        run: node tools/skill-lock.mjs
      - name: Check relative Markdown links resolve
        # The checker itself, and the reasoning behind what it skips, lives in
        # the script — it used to be inlined here, which meant it could only be
        # run by pushing. `npm run check:links` is the same code path.
        run: scripts/check-links.sh
      - name: Check docs site JavaScript parses
        # docs/assets/js/docs.js ships unbundled and unminified, so no build
        # step would ever surface a syntax error in it. A `**Note**/` sequence
        # inside a block comment once closed that comment early and made the
        # whole file unparseable, silently disabling the theme switch, search,
        # table of contents, and copy buttons on every page. `node --check`
        # parses without executing.
        run: node --check docs/assets/js/docs.js
      - name: Knowledge graph visual is intact
        # docs/assets/graph{,-static}.svg are committed artifacts, and since
        # graphify's retirement nothing regenerates them at all — so this gate is
        # the only thing standing between a corrupted asset and main. This
        # lints the committed bytes (accessible name/description, reduced-motion
        # twin genuinely static, well-formed XML, both variants rendering the
        # same graph). It deliberately does not rebuild and diff: the source
        # commit is baked into the image, so a fresh build at this HEAD is
        # legitimately different bytes and would fail on every PR.
        # Regenerate locally with `npm run graph`.
        run: npm run check:graph

  docs-a11y:
    name: Docs site accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check for docs changes
        # GitHub Actions has no job-level `paths:` filter (only workflow-level,
        # which would skip this job's sibling jobs too), so this job checks its
        # own diff and short-circuits every later step when nothing under
        # docs/ or the runner itself changed — the point is skipping the
        # ~350MB Chrome download and Jekyll build, not the checkout.
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(docs/|tools/docs-a11y\.mjs)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.changed.outputs.run == 'true'
      - name: Build docs/ with the real Pages toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: docs
          destination: ./_site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
      - name: Cache Puppeteer's Chrome download
        # `npm install puppeteer` is deliberately unpinned (see the install
        # step below), so there's no lockfile to key on — a static key plus
        # the default "restore even on partial match" behavior is enough,
        # since the cache is only invalidated by evicting it manually.
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-chrome
      - name: Install the accessibility runner's dependencies
        if: steps.changed.outputs.run == 'true'
        # --no-save because pa11y and puppeteer are this gate's alone: the
        # root package.json is a script command center, and adding a ~350MB
        # Chrome download to its devDependencies would tax every other job.
        run: npm install --no-save pa11y puppeteer
      - name: pa11y WCAG2AA in both themes, plus the zero-unlabeled gate
        if: steps.changed.outputs.run == 'true'
        # Zero unlabeled interactive elements is a hard gate, not a coverage
        # percentage — see docs/ACCESSIBILITY.md. This also fails on any
        # uncaught page error, which is how a syntax error in the unbundled
        # docs/assets/js/docs.js would surface: it silently disables every
        # interactive feature while the Jekyll build stays green.
        run: node tools/docs-a11y.mjs ./_site
