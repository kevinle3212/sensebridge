name: CI

# Build and test the SenseBridge iOS app. Until the Swift app is scaffolded
# under app/, the build and test jobs detect the absence of a Swift package /
# Xcode project and no-op so main stays green; they start doing real work
# automatically once the project lands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          shopt -s nullglob
          CANDIDATES=(/Applications/Xcode_*.app)
          if [ ${#CANDIDATES[@]} -gt 0 ]; then
            LATEST="$(printf "%s\n" "${CANDIDATES[@]}" | sort -V | tail -1)"
            sudo xcode-select -switch "$LATEST"
          fi

      - name: Local Swift package build and test
        # `xcodebuild test` already builds the package before testing it —
        # the standalone `swift build` that used to run first here was a
        # full second compilation through a different build system (SPM's
        # own .build/, not Xcode's DerivedData), so its output was never
        # reused by the xcodebuild step that followed. Dropping it removes
        # that redundant compile pass without changing what gets built or
        # tested.
        run: |
          shopt -s nullglob
          for manifest in app/Packages/*/Package.swift; do
            dir="$(dirname "$manifest")"
            name="$(basename "$dir")"
            echo "== $dir =="
            (cd "$dir" && xcodebuild test -scheme "$name" -destination 'platform=macOS' | xcpretty && exit "${PIPESTATUS[0]}")
          done

      - name: Detect project layout
        id: detect
        run: |
          if compgen -G "Package.swift" >/dev/null || compgen -G "app/Package.swift" >/dev/null; then
            echo "kind=spm" >> "$GITHUB_OUTPUT"
          elif compgen -G "app/*.xcodeproj" >/dev/null || compgen -G "app/*.xcworkspace" >/dev/null; then
            echo "kind=xcode" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Swift build and test
        if: steps.detect.outputs.kind == 'spm'
        run: |
          swift build
          swift test

      - name: Xcode build and test
        if: steps.detect.outputs.kind == 'xcode'
        run: |
          PROJ=$(find app -maxdepth 1 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit)
          FLAG=$([[ "$PROJ" == *.xcworkspace ]] && echo -workspace || echo -project)
          xcodebuild build test \
            "$FLAG" "$PROJ" \
            -scheme SenseBridge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit "${PIPESTATUS[0]}"

      - name: No app yet
        if: steps.detect.outputs.kind == 'none'
        run: echo "No Swift package or Xcode project found under app/ yet — skipping build."

  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install SwiftLint and SwiftFormat
        # HOMEBREW_NO_AUTO_UPDATE skips brew's implicit `brew update` (a full
        # homebrew-core index refresh) before installing — usually the
        # single biggest chunk of wall time in a macOS CI `brew install`
        # step for packages that are already bottled. NO_INSTALL_CLEANUP
        # skips the post-install cache-eviction pass, irrelevant on an
        # ephemeral runner.
        run: brew install swiftlint swiftformat
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Run scripts/lint.sh
        run: scripts/lint.sh

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Markdown lint
        # Deliberately unpinned (npx resolves fresh) — see
        # .markdownlint-cli2.jsonc's own comment for why.
        run: npx --yes markdownlint-cli2 "**/*.md"
      - name: Check mirrored skills match canonical
        run: node tools/sync-skills.mjs --check
      - name: Check relative Markdown links resolve
        # Skips **/skills/* — skill/template content (e.g. vendored bmad-*
        # skills) intentionally contains placeholder links ({{path}},
        # ./filename.ext) that are examples, not real navigable docs.
        # Also skips links to gitignored targets (GAPS.md, sessions/,
        # docs/planning/, security/THREAT-MODEL.md, NOTES.local.md, ...):
        # those are intentionally local-only reference docs that never reach
        # the CI checkout, so their absence there isn't a broken link.
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            while read -r link; do
              case "$link" in
                http*|mailto:*|//*) continue ;;
              esac
              target="$(dirname "$file")/$link"
              if [ ! -e "$target" ] && ! git check-ignore -q "$target"; then
                echo "::error file=$file::broken relative link -> $link"
                fail=1
              fi
            done < <(grep -oE '\]\(([^)#]+)' "$file" | sed -E 's/^\]\(//')
          done < <(find . -path ./.git -prune -o -path '*/skills/*' -prune -o -name '*.md' -print0)
          exit $fail
      - name: Check docs site JavaScript parses
        # docs/assets/js/docs.js ships unbundled and unminified, so no build
        # step would ever surface a syntax error in it. A `**Note**/` sequence
        # inside a block comment once closed that comment early and made the
        # whole file unparseable, silently disabling the theme switch, search,
        # table of contents, and copy buttons on every page. `node --check`
        # parses without executing.
        run: node --check docs/assets/js/docs.js

  docs-a11y:
    name: Docs site accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check for docs changes
        # GitHub Actions has no job-level `paths:` filter (only workflow-level,
        # which would skip this job's sibling jobs too), so this job checks its
        # own diff and short-circuits every later step when nothing under
        # docs/ or the runner itself changed — the point is skipping the
        # ~350MB Chrome download and Jekyll build, not the checkout.
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(docs/|tools/docs-a11y\.mjs)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.changed.outputs.run == 'true'
      - name: Build docs/ with the real Pages toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: docs
          destination: ./_site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
      - name: Cache Puppeteer's Chrome download
        # `npm install puppeteer` is deliberately unpinned (see the install
        # step below), so there's no lockfile to key on — a static key plus
        # the default "restore even on partial match" behavior is enough,
        # since the cache is only invalidated by evicting it manually.
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-chrome
      - name: Install the accessibility runner's dependencies
        if: steps.changed.outputs.run == 'true'
        # --no-save because the repo root intentionally has no package.json;
        # this gate is the only thing at the root that needs npm packages.
        run: npm install --no-save pa11y puppeteer
      - name: pa11y WCAG2AA in both themes, plus the zero-unlabeled gate
        if: steps.changed.outputs.run == 'true'
        # Zero unlabeled interactive elements is a hard gate, not a coverage
        # percentage — see docs/ACCESSIBILITY.md. This also fails on any
        # uncaught page error, which is how a syntax error in the unbundled
        # docs/assets/js/docs.js would surface: it silently disables every
        # interactive feature while the Jekyll build stays green.
        run: node tools/docs-a11y.mjs ./_site
