# Native GitHub Code Scanning (Security tab → Code scanning alerts).
# Complements security.yml's TruffleHog/GGShield/OSV/Semgrep with CodeQL,
# which needs its own workflow (github/codeql-action) rather than a job in
# security.yml, since compiled-language analysis (Swift) needs a real build.
#
# Swift analysis runs a full `xcodebuild build` on a macOS runner (~20min), so
# it's restricted to push/schedule/dispatch — it never runs on pull_request,
# so PR CI doesn't pay that cost while iterating. That means Swift is scanned
# only after merge to main, not during PR review, and every PR will carry
# GitHub's "1 configuration not found" Code Scanning banner for
# `/language:swift` (main has a result to compare against; the PR run never
# produces one). That banner is informational — a `neutral` check conclusion
# — and this repo has no required status checks on main, so it never blocks
# a merge. `changes` further gates push runs on whether app/ actually
# changed, so a website-only push to main skips the build too. Want a Swift
# scan on a branch before merging? Trigger it manually: Actions tab → CodeQL
# → "Run workflow" → pick the branch. Don't add pull_request or a
# branch-push trigger for this job to get earlier feedback automatically —
# GitHub Actions caches (and the "1 configuration not found" banner's cache
# of what ran) don't carry over from a feature branch to main, and a merge
# produces a new commit SHA, so it would just pay the ~20min build twice
# instead of once.
# JS/TS CodeQL stays on every PR: it's ubuntu-only and finishes in ~90s.
#
# Two more cuts on top of the changed-paths gate:
# - DerivedData is cached across runs, so most Swift builds are incremental
#   rather than clean.
# - `security-extended`'s slower query set only runs on the weekly schedule;
#   push/dispatch use the faster default suite. The Security tab keeps
#   showing the last full scan's results between runs either way.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan, Wednesdays at 08:00 UTC.
    - cron: "0 8 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changed paths
    # Only gates the swift job, which never runs on pull_request — skip this
    # job there too. schedule/dispatch are deliberate full-scan triggers and
    # always let swift run; push diffs against its own base.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for app/ changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE" "${{ github.sha }}" -- app/; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  swift:
    name: CodeQL (Swift)
    needs: changes
    # push/schedule/dispatch only — never pull_request, so PR CI skips the
    # ~20min xcodebuild cost entirely. See header comment for the tradeoff.
    if: github.event_name != 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          shopt -s nullglob
          CANDIDATES=(/Applications/Xcode_*.app)
          if [ ${#CANDIDATES[@]} -gt 0 ]; then
            LATEST="$(printf "%s\n" "${CANDIDATES[@]}" | sort -V | tail -1)"
            sudo xcode-select -switch "$LATEST"
          fi

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-swift-${{ hashFiles('app/**/*.swift', 'app/**/project.pbxproj') }}
          restore-keys: |
            derived-data-swift-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: swift
          build-mode: manual
          # security-extended's higher-precision queries are slower; reserve
          # them for the weekly full scan and use the faster default suite
          # on push/dispatch, where turnaround matters more.
          queries: ${{ github.event_name == 'schedule' && 'security-extended' || '' }}

      - name: Build app
        run: |
          PROJ=$(find app -maxdepth 1 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit)
          FLAG=$([[ "$PROJ" == *.xcworkspace ]] && echo -workspace || echo -project)
          xcodebuild build \
            "$FLAG" "$PROJ" \
            -scheme SenseBridge \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:swift"

  javascript:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # Skip vendored third-party skill scripts (e.g. impeccable's bundled
          # live-preview server). They run locally on dev machines, ship in
          # nothing, and get overwritten on skill re-vendor — scanning them is
          # noise, not first-party signal. paths-ignore applies to interpreted
          # languages like JS/TS, which is exactly this analysis.
          config: |
            paths-ignore:
              - '.github/skills/**'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:javascript-typescript"
