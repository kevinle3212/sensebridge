# Native GitHub Code Scanning (Security tab → Code scanning alerts).
# Complements security.yml's TruffleHog/GGShield/OSV/Semgrep with CodeQL,
# which needs its own workflow (github/codeql-action) rather than a job in
# security.yml, since compiled-language analysis (Swift) needs a real build.
#
# Swift analysis runs a full `xcodebuild build` on a macOS runner (~20min) —
# ci.yml's build-test job already pays that same macOS/xcodebuild cost on
# every PR, so re-running it a second time just for CodeQL added PR wait
# with no extra PR-time signal. Swift CodeQL therefore only runs on push to
# main, the weekly schedule, and manual dispatch — never on pull_request.
# JS/TS CodeQL stays on every PR: it's ubuntu-only and finishes in ~90s.
#
# Three more cuts on top of that, since most `main` pushes touch docs/website
# and never need a Swift rebuild at all:
# - `changes` skips the `swift` job entirely on a push that never touched
#   app/ — the weekly schedule and manual dispatch always run it regardless.
# - DerivedData is cached across runs, so most Swift builds are incremental
#   rather than clean.
# - `security-extended`'s slower query set only runs on the weekly schedule;
#   push/dispatch use the faster default suite. The Security tab keeps
#   showing the last full scan's results between runs either way.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan, Wednesdays at 08:00 UTC.
    - cron: "0 8 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changed paths
    # Only a push needs the check — schedule/dispatch are already deliberate
    # full-scan triggers, so those always let the swift job run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for app/ changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- app/; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  swift:
    name: CodeQL (Swift)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          shopt -s nullglob
          CANDIDATES=(/Applications/Xcode_*.app)
          if [ ${#CANDIDATES[@]} -gt 0 ]; then
            LATEST="$(printf "%s\n" "${CANDIDATES[@]}" | sort -V | tail -1)"
            sudo xcode-select -switch "$LATEST"
          fi

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-swift-${{ hashFiles('app/**/*.swift', 'app/**/project.pbxproj') }}
          restore-keys: |
            derived-data-swift-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          languages: swift
          build-mode: manual
          # security-extended's higher-precision queries are slower; reserve
          # them for the weekly full scan and use the faster default suite
          # on push/dispatch, where turnaround matters more.
          queries: ${{ github.event_name == 'schedule' && 'security-extended' || '' }}

      - name: Build app
        run: |
          PROJ=$(find app -maxdepth 1 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit)
          FLAG=$([[ "$PROJ" == *.xcworkspace ]] && echo -workspace || echo -project)
          xcodebuild build \
            "$FLAG" "$PROJ" \
            -scheme SenseBridge \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          category: "/language:swift"

  javascript:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # Skip vendored third-party skill scripts (e.g. impeccable's bundled
          # live-preview server). They run locally on dev machines, ship in
          # nothing, and get overwritten on skill re-vendor — scanning them is
          # noise, not first-party signal. paths-ignore applies to interpreted
          # languages like JS/TS, which is exactly this analysis.
          config: |
            paths-ignore:
              - '.github/skills/**'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          category: "/language:javascript-typescript"
