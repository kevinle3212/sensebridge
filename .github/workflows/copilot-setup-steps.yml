# GitHub's documented convention for bootstrapping the Copilot coding agent's
# environment: a job named exactly `copilot-setup-steps` is auto-detected and
# run before the agent starts working, so its first commands don't have to
# `npm install` from scratch.
#
# Copilot's coding agent runs on a Linux (ubuntu-latest-class) environment, not
# macOS — it can prep the root and website/ Node toolchains here (eslint,
# prettier, markdownlint-cli2, commitlint at root; Stylelint/ESLint/Prettier/
# Astro in website/), but it cannot run Xcode or build the iOS app (app/),
# which needs a Mac. State that plainly rather than implying full-repo agent
# coverage: assign Copilot issues/PRs scoped to website/, docs, root tooling,
# or CI config, not app/ Swift changes.

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci
        working-directory: website
