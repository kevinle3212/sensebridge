name: Security

# Lightweight, serverless-appropriate security scanning: secret detection
# (TruffleHog + GitGuardian), dependency vulnerability scanning, and generic
# static analysis (scripts, workflows, website/). The app itself has no
# server or backend attack surface — this stays narrow on purpose.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: TruffleHog
        # Pinned to a released tag, not the mutable @main ref: a moving action
        # ref is a supply-chain risk (upstream could change under us between runs).
        # Bump deliberately; Dependabot's github-actions ecosystem tracks it.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  ggshield:
    name: Secret scan (GitGuardian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for a GitGuardian credential
        id: credential
        # `secrets` is not available in a job-level `if`, so the gate lives
        # here. A fork has no GITGUARDIAN_API_KEY and would otherwise fail this
        # job on every PR for lacking a credential it was never meant to have.
        # TruffleHog (the job above) needs no key and still covers every fork.
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No GITGUARDIAN_API_KEY secret — skipping ggshield. Expected on forks; TruffleHog still ran." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: ggshield
        if: steps.credential.outputs.present == 'true'
        # Pinned to the commit behind the v1.52.2 tag, not the mutable v1
        # ref — same rationale as the other pinned actions in this workflow.
        uses: GitGuardian/ggshield-action@2002482fb5990b486be5598ebcf48a8eba393fce
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  osv-scan:
    name: Dependency scan (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: OSV Scanner
        # Pinned exactly: this repo publishes no moving v2 major tag.
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  sensitive-files:
    name: Sensitive file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for signing/credential material
        run: node tools/check-sensitive-files.mjs --all

  semgrep:
    name: Semgrep (scripts, workflows, website, Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        # Pinned to the commit behind the v1 tag, not the mutable ref itself —
        # same rationale as the other two scanners above. Bump deliberately.
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/swift

  dependency-review:
    name: Dependency review (new/changed deps in this PR)
    # PR-only: it diffs base vs head, which doesn't exist on a push event.
    # Complements osv-scan (recursive, whole-tree) by flagging newly
    # introduced vulnerable/copyleft dependencies inline on the PR diff,
    # before they land in the lockfile osv-scan checks afterward.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
